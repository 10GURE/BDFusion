model:
  base_learning_rate: 2.0e-06
  target: informationSynthesis.I2Iddpm.LatentDiffusion
  params:
    linear_start: 0.0015
    linear_end: 0.0195
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    image_size: 64
    channels: 4
    concat_mode: True
    ir_loss_weight: 0.1  # IR 监督损失权重
    
    # ============================================================
    # Ablation: Degradation Encoder 开关
    # ============================================================
    # 设为 true 启用 dual-stream degradation encoder (默认)
    # 设为 false 关闭 degradation encoder (ablation baseline)
    use_degradation_encoder: true
    degradation_encoder_type: 'dual_stream'  # 'basic' 或 'dual_stream'
    
    # ============================================================
    # BLIND Degradation Encoder 配置 (AirNet-style)
    # ============================================================
    # 核心设计理念:
    # - 模型自动从图像内容中提取退化信息
    # - 无需显式的退化类型标签 (task_id)
    # - 训练时只需提供退化/干净图像对
    # - DegradationEncoder 从图像编码中学习识别退化模式
    # 
    # 工作流程:
    # 1. DegradationEncoder 从退化的 RGB/IR 图像提取 task_tokens
    # 2. task_tokens 作为条件注入到 UNet 中引导恢复
    # 3. 相似退化类型自动映射到相似的嵌入空间
    # ============================================================
    
    unet_config:
      target: informationSynthesis.I2Iopenaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 9
        out_channels: 3
        model_channels: 256
        context_channels: 256
        cross_attention_resolutions:
        # note: this isn't actually the resolution but
        # the downsampling factor, i.e. this corresponds to
        # attention on spatial resolution 8,16,32, as the
        # spatial resolution of the latents is 64 for f4
        - 8
        - 4
        - 2
        - 1
        attention_resolutions:
        # note: this isn't actually the resolution but
        # the downsampling factor
        - 8
        - 4
        - 2
        num_res_blocks: 1
        channel_mult:
        - 1
        - 2
        - 3
        - 4
        num_heads: 8
        resblock_updown: true
        
    encoder_config:
      target: informationSynthesis.I2Iopenaimodel.FeatureEncoder
      params:
        image_size: 64
        in_channels: 4
        out_channels: 4
        model_channels: 256
        attention_resolutions:
          - 8
        num_res_blocks: 1
        channel_mult:
          - 1
          - 2
          - 3
          - 4
        num_heads: 8
        resblock_updown: true
        
    first_stage_config:
      target: ldm.models.autoencoder.VQModelInterface
      params:
        ckpt_path: models/first_stage_models/vq-f4/model.ckpt
        embed_dim: 3
        n_embed: 8192
        ddconfig:
          double_z: false
          z_channels: 3
          resolution: 128
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
            - 1
            - 2
            - 4
          num_res_blocks: 2
          attn_resolutions: [ ]
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
          
    cond_stage_config: __is_first_stage__

data:
  target: train_model.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 8
    wrap: false
    
    # ============================================================
    # BLIND All-in-One 数据集配置
    # ============================================================
    # 关键点: 不需要显式的 task_id 标签!
    # - 只需提供 (退化图像, 干净GT) 对
    # - DegradationEncoder 自动从退化图像内容中学习识别退化类型
    # ============================================================
    train:
      target: informationSynthesis.dataset.DegradedFusionDatasetTrain
      params:
        rgb_root: './data/msrs_bd-f/rgb_degraded/train/'
        ir_root: './data/msrs_bd-f/ir_degraded/train/'
        clean_root: './data/msrs_bd-f/gt_clean/train/'
        ir_clean_root: './data/msrs_bd-f/ir_clean/train/'
        size: 256
        random_crop: True
        apply_rgb_aug: False
        apply_ir_aug: False
        extra_noise: False
        
    validation:
      target: informationSynthesis.dataset.DegradedFusionDatasetVal
      params:
        rgb_root: './data/msrs_bd-f/rgb_degraded/val/'
        ir_root: './data/msrs_bd-f/ir_degraded/val/'
        clean_root: './data/msrs_bd-f/gt_clean/val/'
        ir_clean_root: './data/msrs_bd-f/ir_clean/val/'
        size: 256


lightning:
  callbacks:
    image_logger:
      target: train_model.ImageLogger
      params:
        batch_frequency: 1000
        max_images: 8
        increase_log_steps: False

  trainer:
    benchmark: True
    check_val_every_n_epoch: 50
    gpus: 0,
    max_epochs: 300
